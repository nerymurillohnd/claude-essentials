[project]
name = "claude-essentials-maintainer"
version = "0.0.0"
description = "Maintainer tooling for the claude-essentials plugin marketplace. Never distributed."
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.12.17"
default-groups = ["dev"]
# Supply-chain cooldown: resolve only releases published at least 4 days ago.
# A deliberate bump that needs a newer release uses `uv lock --upgrade-package <name>`.
exclude-newer = "4 days"

[dependency-groups]
# Exact pins so a Dependabot bump is visible in this manifest, not only in uv.lock.
dev = [
  "actionlint-py==1.7.12.24",
  "basedpyright==1.40.1",
  "jsonschema==4.26.0",
  "mini-racer==0.14.1",
  "pytest==9.1.1",
  "pytest-github-actions-annotate-failures==0.4.2",
  "pyyaml==6.0.3",
  "ruff==0.16.8",
  "shellcheck-py==0.11.0.1",
  "shfmt-py==4.2.0",
  "types-pyyaml==6.0.12.20260906",
  "zizmor==1.30.1",
]

# ---------------------------------------------------------------------------
# Ruff — transcription of ~/.config/ruff/ruff.toml (the rigor floor, P11).
# This project config replaces the user-level file entirely, so it carries the
# full policy. `ruff.toml`/`.ruff.toml` must never exist here: they would take
# precedence over this section.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
required-version = ">=0.16.7"
force-exclude = true
respect-gitignore = true

# Ruff's standard exclusions, plus this repository's generated and non-source trees.
extend-exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".ipynb_checkpoints",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pyenv",
  ".pytest_cache",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pycache__",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
  "**/evals/**",
  "docs/",
  "templates/",
]

# Shipped plugin Python targets the floor its README declares, not the maintainer's 3.14.
per-file-target-version = { "plugins/agent-self-knowledge/**" = "py39" }

[tool.ruff.lint]
# Explicit selection (official recommendation)
select = [
  # Core
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "BLE",  # flake8-blind-except
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "C90",  # McCabe complexity
  "A",    # flake8-builtins
  "COM",  # flake8-commas
  "DTZ",  # flake8-datetimez
  "T10",  # flake8-debugger
  "EXE",  # flake8-executable
  "FA",   # flake8-future-annotations
  "FBT",  # flake8-boolean-trap
  "ISC",  # flake8-implicit-str-concat
  "ICN",  # flake8-import-conventions
  "G",    # flake8-logging-format
  "INP",  # flake8-no-pep420
  "PIE",  # flake8-pie
  "PYI",  # flake8-pyi
  "PT",   # flake8-pytest-style
  "Q",    # flake8-quotes
  "RSE",  # flake8-raise
  "RET",  # flake8-return
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "TID",  # flake8-tidy-imports
  "TC",   # flake8-type-checking
  "INT",  # flake8-gettext
  "ARG",  # flake8-unused-arguments
  "PTH",  # flake8-use-pathlib
  "TD",   # flake8-todos
  "FIX",  # flake8-fixme
  "ERA",  # eradicate
  "PD",   # pandas-vet
  "PGH",  # pygrep-hooks
  "PL",   # Pylint
  "TRY",  # tryceratops
  "FLY",  # flynt
  "NPY",  # NumPy-specific
  "PERF", # Perflint
  "FURB", # refurb
  "LOG",  # flake8-logging
  "RUF",  # Ruff-specific rules
  "ANN",  # flake8-annotations
  "D",    # pydocstyle
  "N",    # pep8-naming
  "S",    # flake8-bandit
]

# Rules that conflict with the formatter (official recommendation)
# + practical ignores for standalone scripts
ignore = [
  # === Formatter conflicts (must ignore) ===
  "W191",   # tab-indentation
  "E111",   # indentation-with-invalid-multiple
  "E114",   # indentation-with-invalid-multiple-comment
  "E117",   # over-indented
  "D203",   # incorrect-blank-line-before-class
  "D206",   # docstring-tab-indentation
  "D300",   # triple-single-quotes
  "Q000",   # bad-quotes-inline-string
  "Q001",   # bad-quotes-multiline-string
  "Q002",   # bad-quotes-docstring
  "Q003",   # avoidable-escaped-quote
  "Q004",   # unnecessary-escaped-quote
  "COM812", # missing-trailing-comma
  "COM819", # prohibited-trailing-comma
  "ISC002", # multi-line-implicit-string-concatenation

  # === Practical for standalone scripts ===
  "D100",   # Missing docstring in public module
  "D104",   # Missing docstring in public package
  "D213",   # Multi-line docstring summary should start at the second line
  "S101",   # Use of `assert`
  "S603",   # subprocess-without-shell-equals-true: flags every non-literal argv element; Ruff documents it as prone to false positives (astral-sh/ruff#4045). S607 stays.
  "INP001", # File is part of an implicit namespace package
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# Only formatter-compatible isort settings
force-sort-within-sections = true
combine-as-imports = true
order-by-type = true
# Do NOT use: force-single-line, force-wrap-aliases, split-on-trailing-comma

[tool.ruff.lint.mccabe]
# Keep branching understandable in portable hooks and automation scripts.
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
mypy-init-return = true
suppress-dummy-args = true
suppress-none-returning = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 100

# ---------------------------------------------------------------------------
# basedpyright — the type-quality half of the gate. `pyrightconfig.json` must
# never exist: it would take precedence over this section.
# ---------------------------------------------------------------------------
[tool.basedpyright]
typeCheckingMode = "all"
failOnWarnings = true
include = ["scripts"]
exclude = [".venv", "docs", "templates", "**/evals/**", "node_modules"]
# `exclude` alone still reports files reached through imports (basedpyright #31).
ignore = [".venv", "docs", "templates", "**/evals/**", "node_modules"]
pythonVersion = "3.14"
pythonPlatform = "All"
reportMissingModuleSource = "error"
enableTypeIgnoreComments = false
allowedUntypedLibraries = []
# The only permitted downgrade: the same check the Ruff floor ignores as a
# formatter conflict (ISC002). Upstream basedpyright disables it for that reason.
reportImplicitStringConcatenation = false

[tool.pytest.ini_options]
testpaths = ["scripts"]
pythonpath = ["."]
markers = [
  "slow: spawns processes",
  "coverage_matrix: nightly, diffs KNOWN_TOOLS against the live CLI",
]
addopts = "--strict-markers -q"
xfail_strict = true
