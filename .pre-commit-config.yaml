# Local pre-commit hooks, run by prek (https://github.com/j178/prek), a drop-in
# replacement for pre-commit. Install once: `uv tool install prek` and `prek install`.
# Every hook is local with `language: system`: it runs the ruff and basedpyright found
# on PATH, so no version is pinned here (https://prek.j178.dev/local-hooks/).
repos:
  - repo: local
    hooks:
      # With --fix, the lint hook runs before the formatter.
      - id: ruff-check
        name: ruff check
        language: system
        entry: ruff check --force-exclude --fix
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        language: system
        entry: ruff format --force-exclude
        types_or: [python, pyi]
      # --warnings matches the python gate: warnings fail like errors. basedpyright
      # checks the whole project from pyrightconfig.json, not the staged files alone.
      - id: basedpyright
        name: basedpyright
        language: system
        entry: basedpyright --warnings
        types_or: [python, pyi]
        pass_filenames: false
