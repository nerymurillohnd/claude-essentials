name: Evals

# Behavioural evals of the plugins whose runtime a pull request changes (D2). Informational
# only: never a required check, never blocking, and skipped when ANTHROPIC_API_KEY is absent.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      plugins:
        description: Space-separated plugin ids to evaluate
        required: true
        type: string

# No job inherits a grant; each job below asks for exactly what it uses.
permissions: {}

# Same pinned CLI as the gate (G2 keeps every pinned workflow equal).
env:
  CLAUDE_CODE_VERSION: "2.1.278"
  # A pinned CLI that updated itself mid-run would no longer be the version pinned above.
  DISABLE_AUTOUPDATER: "1"

# A new push to a pull request supersedes the evals in flight; a dispatch always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Holds no secret. The selection is the runtime classification that decides bumps
  # (§A11), read from `make versions --json`, so README, CHANGELOG, docs and evals/ edits
  # never select a plugin.
  select:
    name: Select plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the history and the tags the runtime classification compares against
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Create the environment from uv.lock
        run: make setup

      - name: Select the plugins whose runtime changed
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REQUESTED: ${{ inputs.plugins }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            read -r -a requested <<<"${REQUESTED}"
            for id in "${requested[@]}"; do
              if [[ ! "${id}" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ || ! -d "plugins/${id}" ]]; then
                echo "::error::${id} is not a plugin directory under plugins/"
                exit 1
              fi
            done
            plugins="$(printf '%s\n' "${requested[@]}" | jq -R . | jq -cs .)"
          else
            # A missing bump makes check_versions exit non-zero, but its JSON is still the
            # classification; version-check is the job that fails on the bump.
            report="$(make -s versions VERSIONS_ARGS="--base origin/${BASE_REF} --json")" || true
            plugins="$(jq -c '[.plugins[] | select(.runtime_changed) | .name]' <<<"${report}")"
          fi
          if [[ "${plugins}" == "[]" ]]; then
            echo "no plugin runtime changed"
          else
            echo "selected: ${plugins}"
          fi
          echo "plugins=${plugins}" >>"${GITHUB_OUTPUT}"

  eval:
    name: Eval ${{ matrix.plugin }}
    needs: select
    if: needs.select.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    # ANTHROPIC_API_KEY is an environment secret of `evals`, never a repository secret, so
    # no other job can read it (zizmor secrets-outside-env).
    environment: evals
    permissions:
      contents: read # check out the plugin and its evals/ suite
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}
    env:
      PLUGIN: ${{ matrix.plugin }}
      MAX_COST_USD: "15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ -z "${ANTHROPIC_API_KEY}" ]]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; the eval of ${PLUGIN} is skipped"
            echo "present=false" >>"${GITHUB_OUTPUT}"
          else
            echo "present=true" >>"${GITHUB_OUTPUT}"
          fi

      # Bash grants need a sandbox backend on Linux, or every run errors.
      - name: Install the sandbox backend
        if: steps.key.outputs.present == 'true'
        run: sudo apt-get install -y bubblewrap socat

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.key.outputs.present == 'true'
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Create the environment from uv.lock
        if: steps.key.outputs.present == 'true'
        run: make setup

      - name: Install Claude Code CLI (pinned, signature-verified; CI runner only)
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.github.install_claude_code "${CLAUDE_CODE_VERSION}" --dest "${RUNNER_TEMP}/claude-code"
          echo "${RUNNER_TEMP}/claude-code" >>"${GITHUB_PATH}"
          "${RUNNER_TEMP}/claude-code/claude" --version

      # The operator grant is the one the suite's own README documents under "Running it",
      # so the workflow never keeps a second copy that could drift from the cases.
      - name: Run the eval suite
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          readme="plugins/${PLUGIN}/evals/README.md"
          grant="$(sed -nE 's/^[[:space:]]*--allow-tools[[:space:]]+(.*[^[:space:]\\])[[:space:]]*\\?$/\1/p' "${readme}" | head -n 1)"
          read -r -a tools <<<"${grant}"
          allow=()
          if ((${#tools[@]})); then allow=(--allow-tools "${tools[@]}"); fi
          out="${RUNNER_TEMP}/eval"
          mkdir -p "${out}"
          claude plugin eval "plugins/${PLUGIN}" --trust-plugin --ablation with-without \
            --runs 3 --no-publish --max-cost-usd "${MAX_COST_USD}" \
            --model claude-sonnet-5 --judge-model claude-opus-5 "${allow[@]}" \
            --json "${out}/results.json" --report "${out}/report.html"

      - name: Upload the results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-${{ matrix.plugin }}
          path: |
            ${{ runner.temp }}/eval/results.json
            ${{ runner.temp }}/eval/report.html
          if-no-files-found: warn
