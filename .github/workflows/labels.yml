name: Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - "plugins/*/.claude-plugin/plugin.json"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply label taxonomy (never prunes — pruning is a manual, reviewed step)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-labels.mjs --apply
