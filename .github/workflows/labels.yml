name: Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.json"
      - "plugins/*/.claude-plugin/plugin.json"
  workflow_dispatch:

# No job inherits a grant; the one job below asks for exactly what it uses.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    name: Apply the label taxonomy
    runs-on: ubuntu-latest
    permissions:
      contents: read # read .github/labels.json and the plugin manifests
      issues: write # create, update and rename labels
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A job holding a write token restores no cache and builds no sdist (A12).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: false

      - name: Create the environment from uv.lock (wheels only)
        run: uv sync --locked --no-build --no-install-package actionlint-py

      - name: Apply label taxonomy (never prunes; pruning is a manual, reviewed step)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .venv/bin/python -m scripts.github.sync_labels --apply
