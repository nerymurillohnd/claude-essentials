name: Stale needs-info issues

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: "status: needs-info"
          days-before-issue-stale: 14
          days-before-issue-close: 7
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: "status: stale"
          close-issue-reason: not_planned
          remove-issue-stale-when-updated: true
          stale-issue-message: >
            This issue has waited 14 days for the requested information. It will be
            closed as not planned in 7 days unless those details are added.
            Replying moves it back to triage.
          close-issue-message: >
            Closed as not planned because the requested information did not arrive.
            Comment with the details and a maintainer will reopen it.
