name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# Claude Code CLI used by `claude plugin validate` / `claude plugin tag`. It is
# installed on the runner only — never as a repo dependency (ADR-0003). Bump it
# deliberately, in every workflow that sets it.
env:
  CLAUDE_CODE_VERSION: "2.1.276"

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Same versions as the maintainer's machine; .shellcheckrc enables optional
      # checks that older ShellCheck releases don't know (DEBT-0003).
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      SHFMT_VERSION: "3.14.1"
      SHFMT_SHA256: "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI (pinned; CI runner only)
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Format & lint (Biome)
        run: npm run biome:ci

      - name: Install ShellCheck and shfmt (pinned, checksum-verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${tmp}/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "${tmp}/shellcheck.tar.xz" -C "${tmp}"
          sudo install -m 0755 "${tmp}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL -o "${tmp}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  ${tmp}/shfmt" | sha256sum --check --strict
          sudo install -m 0755 "${tmp}/shfmt" /usr/local/bin/shfmt
          shellcheck --version | sed -n 2p
          shfmt --version

      - name: Lint shell scripts (ShellCheck + shfmt)
        run: npm run lint:sh

      - name: Type check (tsc, max-strict tsconfig.json)
        run: npm run typecheck

      - name: Unused files, exports, and dependencies (Knip)
        run: npm run knip -- --reporter github-actions

      - name: Unit tests
        run: npm test

      - name: Regenerate marketplace catalog and issue forms
        run: npm run generate

      - name: Fail if generation changed tracked files
        run: |
          if ! git diff --exit-code -- .claude-plugin/marketplace.json .github/ISSUE_TEMPLATE; then
            echo "::error::Generated files are out of date — run 'npm run generate' and commit the result."
            exit 1
          fi

      - name: Validate marketplace + plugin manifests
        run: npm run validate

      - name: Validate with Claude Code (official, --strict)
        run: npm run validate:claude

  version-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Claude Code CLI (pinned; CI runner only)
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      - name: Enforce plugin version bumps (ADR-0003)
        env:
          BASE_REF: ${{ github.base_ref }}
          DEFERRED: "${{ contains(github.event.pull_request.labels.*.name, 'bump: deferred') }}"
        run: |
          args=(--base "origin/${BASE_REF}" --verify-tag)
          if [[ "${DEFERRED}" == "true" ]]; then args+=(--deferred); fi
          node scripts/check-versions.mjs "${args[@]}"
