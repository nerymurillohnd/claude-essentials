name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# No job inherits a grant; each job below asks for exactly what it uses.
permissions: {}

# Claude Code CLI used by `claude plugin validate` and `claude plugin tag`. It is installed
# on the runner only, from Anthropic's signed release manifest (scripts.github.
# install_claude_code), never as a repo dependency (ADR-0003). Dependabot cannot see an env
# value, so bump it by hand, in every workflow that sets it (G2 keeps them equal).
env:
  CLAUDE_CODE_VERSION: "2.1.278"
  # A pinned CLI that updated itself mid-run would no longer be the version pinned above.
  DISABLE_AUTOUPDATER: "1"

# A new push to a pull request supersedes the run in flight; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole gate, exactly as the maintainer runs it: `make check` (G2 asserts it).
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tree; nothing is written back
    steps:
      # Full history and tags: C2 compares released CHANGELOG sections with their tags and X3
      # diffs the ADRs against origin/main; a shallow clone would let both pass vacuously.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Create the environment from uv.lock
        run: make setup

      # The plugin suites call ruff, shellcheck and shfmt from PATH. Only those three locked
      # binaries are exposed, so `python3` stays the runner's own interpreter, as it is for a
      # user of the plugins.
      - name: Put the locked lint binaries on PATH
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/locked-tools"
          mkdir -p "${tools}"
          for tool in ruff shellcheck shfmt; do
            ln -s "${GITHUB_WORKSPACE}/.venv/bin/${tool}" "${tools}/${tool}"
          done
          echo "${tools}" >>"${GITHUB_PATH}"

      - name: Install Claude Code CLI (pinned, signature-verified; CI runner only)
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.github.install_claude_code "${CLAUDE_CODE_VERSION}" --dest "${RUNNER_TEMP}/claude-code"
          echo "${RUNNER_TEMP}/claude-code" >>"${GITHUB_PATH}"
          "${RUNNER_TEMP}/claude-code/claude" --version

      # zizmor runs with --offline here as on a laptop (ZIZMOR_OFFLINE in
      # scripts/lint/workflows_files.py): its online audits cannot pass on the untagged
      # validate-plugins pin. No GH_TOKEN is passed because nothing in the gate needs one.
      - name: make check
        env:
          RUFF_OUTPUT_FORMAT: github
        run: make check

  # On pull requests it gates the merge (required check). On direct pushes to main
  # (non-runtime changes, gated locally by .claude/hooks/guard-push.sh) it checks the pushed
  # range after the fact, so a runtime change without a bump still turns main red.
  version-check:
    name: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the history and the tags the bump rules compare against
      pull-requests: read # on main, find the merged pull request and its bump: deferred label
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Create the environment from uv.lock
        run: make setup

      - name: Install Claude Code CLI (pinned, signature-verified; CI runner only)
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.github.install_claude_code "${CLAUDE_CODE_VERSION}" --dest "${RUNNER_TEMP}/claude-code"
          echo "${RUNNER_TEMP}/claude-code" >>"${GITHUB_PATH}"
          "${RUNNER_TEMP}/claude-code/claude" --version

      # After a push the tag workflow runs in parallel and may already have created the tag,
      # so the tag dry run belongs to pull requests only.
      - name: Enforce plugin version bumps (ADR-0003)
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          PR_DEFERRED: "${{ contains(github.event.pull_request.labels.*.name, 'bump: deferred') }}"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deferred_flag=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if [[ "${PR_DEFERRED}" == "true" ]]; then deferred_flag=" --deferred"; fi
            make versions VERSIONS_ARGS="--base origin/${BASE_REF} --verify-tag${deferred_flag} --output-format=github"
          else
            labels="$(gh api "repos/${REPOSITORY}/commits/${SHA}/pulls" --jq '.[].labels[].name')"
            if grep -qxF 'bump: deferred' <<<"${labels}"; then deferred_flag=" --deferred"; fi
            make versions VERSIONS_ARGS="--base ${BEFORE}${deferred_flag} --output-format=github"
          fi

  # Anthropic's canonical marketplace validation. Not a required check until it has been
  # green once (plan Part C); then it joins check and version-check in ruleset 23655894.
  official:
    name: official
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the action diffs the pull request against its base
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The action publishes no releases, so the pin names the default-branch commit date.
      - uses: anthropics/claude-plugins-community/.github/actions/validate-plugins@a727be1c7bd6064419b6f60d71993a19198adc17 # 2026-08-24
        with:
          claude-cli-version: ${{ env.CLAUDE_CODE_VERSION }}
          fail-on-warnings: "true"
          skip-external: "true"
