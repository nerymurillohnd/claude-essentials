name: Label pull requests

# pull_request_target lets the labeler add labels to pull requests from forks.
# This workflow never checks out or runs pull request code: actions/labeler only
# reads the list of changed files through the API and .github/labeler.yml from
# the base branch.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # add and remove path labels on the pull request
    steps:
      - name: Label by changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
