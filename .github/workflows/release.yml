name: Release

on:
  push:
    tags:
      # Plugin tags come from `claude plugin tag`: <name>--v<version>.
      # Only plugins are released; the catalog has no version.
      - "*--v[0-9]*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Check the tag against the manifest and validate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release_notes.py verify "${TAG}"
          claude plugin validate "plugins/${TAG%%--v*}" --strict

      - name: Extract release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release_notes.py notes "${TAG}" > "${RUNNER_TEMP}/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
