name: Release

on:
  push:
    tags:
      # Plugin tags come from `claude plugin tag`: <name>--v<version>.
      # Marketplace tags use the reserved name: marketplace--v<version>.
      - "*--v[0-9]*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release for the pushed tag
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: false

      - name: Install Claude Code
        env:
          CLAUDE_CODE_VERSION: "2.1.289"
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the tag against the manifest and validate
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run scripts/release_notes.py verify "$TAG"
          name="${TAG%%--v*}"
          if [ "$name" = "marketplace" ]; then
            claude plugin validate . --strict
          else
            claude plugin validate "plugins/$name" --strict
          fi

      - name: Extract release notes from the changelog
        env:
          TAG: ${{ github.ref_name }}
        run: uv run scripts/release_notes.py notes "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
