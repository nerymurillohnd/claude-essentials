name: Claude Code Review

# Reviews every push to a pull request: re-checks whether earlier findings were
# fixed, then reviews the new state against this repository's rules and for
# correctness, and posts inline comments plus one summary (docs/automation.md).
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: claude-code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # read the checked-out code
      pull-requests: write # gh pr comment posts the summary (the action's review example)
      issues: read # read earlier comments on the pull request
      id-token: write # OIDC exchange for the Claude GitHub App token
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@cab360f6565aa35a51d6ce9e43f1f4287c0a32ea # v1.0.241
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}. This runs on every push, so a pull request is reviewed again after each change.

            1. Re-check earlier reviews. Read the earlier review comments with `gh pr view ${{ github.event.pull_request.number }} --comments` and `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`. For each finding Claude posted before, decide from the current code whether it is fixed, partly fixed or still open, citing file:line.
            2. Review the current state with `gh pr diff ${{ github.event.pull_request.number }}`, reading changed files with the Read tool. Check correctness bugs, and this repository's rules: CLAUDE.md, docs/quality-bar.md, docs/security-review.md for hooks, MCP or LSP servers, bin/, monitors or mods, docs/releasing.md for versions, changelogs and the semver label, and portability (no absolute or home paths, secrets, personal data, ../ or files outside plugins/<name>/). The gates already run in CI; do not repeat them.
            3. Report only findings you can cite with file:line from the current head. Post each new finding with `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`). Then post one summary comment with `gh pr comment` that starts with "Claude review of <short head sha>" and contains: a verdict (ready, changes needed or blocked), a table of earlier findings with fixed, partly fixed or open, and the count of new findings.

            Never approve, request changes as a review state, push, edit files or close anything.
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Read,Grep,Glob"
