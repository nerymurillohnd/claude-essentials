name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Gates and isolated install test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Set up Node.js for Prettier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install the latest tools
        env:
          GH_TOKEN: ${{ github.token }} # gh downloads the latest actionlint release
        run: |
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          scripts/check.py ci-tools

      - name: Run every gate
        run: scripts/check.py

      - name: Install every plugin in an isolated config
        run: scripts/check.py test-install
