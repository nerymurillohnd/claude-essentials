# Dependabot version updates (security updates and alerts are enabled in repo
# settings). Labels come from .github/labels.json (ADR-0004); the triage bot adds
# area:/bump: labels on its own. The Claude Code CLI pinned by CLAUDE_CODE_VERSION
# in the workflows is an env value Dependabot can't see — bump it by hand (DEBT-0004).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - "type: maintenance"
      - "area: tooling"
    groups:
      dev-dependencies:
        dependency-type: development
    cooldown:
      default-days: 3
      semver-major-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "type: maintenance"
      - "area: ci"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3
      semver-major-days: 7
