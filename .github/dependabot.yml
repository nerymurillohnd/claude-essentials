# Dependabot version updates (security updates and alerts are enabled in repo
# settings). Labels come from .github/labels.json (ADR-0004); the triage bot adds
# area:/bump: labels on its own. The Claude Code CLI version pinned by CLAUDE_CODE_VERSION
# in the workflows is an env value Dependabot cannot see; bump it by hand.
version: 2
updates:
  # pyproject.toml pins every tool exactly and uv.lock is committed, so one grouped
  # pull request moves the manifest and the lock together. The cooldown is longer
  # than `[tool.uv] exclude-newer` (4 days): a release younger than that window
  # cannot be locked, and Dependabot would open a pull request uv refuses.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels:
      - "type: maintenance"
      - "area: tooling"
    groups:
      uv:
        patterns:
          - "*"
    cooldown:
      default-days: 5
      semver-major-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "type: maintenance"
      - "area: ci"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 3
      semver-major-days: 7
