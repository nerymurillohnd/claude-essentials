name: Feature request
description: Suggest an improvement to an existing plugin or to the marketplace.
title: "[Feature]: "
labels:
  - "type: feature"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Proposing a whole new plugin, skill, or agent? Use the **Plugin proposal** form instead.
  - type: dropdown
    id: plugin
    attributes:
      label: Affected plugin
      options:
        - Marketplace catalog / installation
        - block-no-verify
        - ruff-quality
        - shell-quality
        - verify-completion
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Where you'd use the improvement.
      multiple: true
      options:
        - Claude Code
        - Claude Cowork
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Note anything that would break existing users.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and discussions and this is not a duplicate.
          required: true
