name: Plugin submission
description: Track a pull request that adds an accepted plugin proposal to the catalog.
title: "submission: <plugin-name>"
labels: ["type:feature", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Open this after your proposal is accepted and your pull request is ready.
        Plugins live in this repository under `plugins/<name>/` and are created with `uv run scripts/new_plugin.py`.
  - type: input
    id: proposal
    attributes:
      label: Accepted proposal
      description: Link to the plugin proposal issue.
    validations:
      required: true
  - type: input
    id: pull-request
    attributes:
      label: Pull request
      description: Link to the pull request that adds the plugin.
    validations:
      required: true
  - type: input
    id: min-version
    attributes:
      label: Minimum Claude Code version tested
      placeholder: 2.1.289
    validations:
      required: true
  - type: checkboxes
    id: quality-bar
    attributes:
      label: Quality bar
      description: Every item in docs/quality-bar.md applies; confirm the ones maintainers check first.
      options:
        - label: "`make check` passes locally, including the isolated install test (`make test-install`)."
          required: true
        - label: The plugin README explains every component with a concrete example and has no TODO left.
          required: true
        - label: The plugin has no machine-specific paths, secrets, personal data or files outside its directory.
          required: true
        - label: Hooks, MCP or LSP servers, executables and mods are listed under Permissions and justified.
          required: true
        - label: I have the right to contribute this work under the MIT License.
          required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How you verified the plugin works
      description: Sessions you ran, prompts you used and what happened; `claude plugin eval` results if you have them.
    validations:
      required: true
