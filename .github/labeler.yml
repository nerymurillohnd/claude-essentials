# Pull request labels by changed path (actions/labeler v7 format).
# scripts/new_plugin.py appends the plugin:<name> and category:<category> rules.

"type:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - docs/**

"type:chore":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/**
          - tests/**
          - templates/**
          - Makefile
          - .editorconfig
          - .gitignore
          - pyrightconfig.json
          - ruff.toml

"security-review":
  - changed-files:
      - any-glob-to-any-file:
          - plugins/*/hooks/**
          - plugins/*/.mcp.json
          - plugins/*/.lsp.json
          - plugins/*/bin/**
          - plugins/*/monitors/**
          - .github/workflows/**

"plugin:hello-example":
  - changed-files:
      - any-glob-to-any-file:
          - plugins/hello-example/**

"category:development":
  - changed-files:
      - any-glob-to-any-file:
          - plugins/hello-example/**
