# Pull request labels by changed path (actions/labeler v7 format).
# scripts/new_plugin.py appends the plugin:<name> and category:<category> rules.

# Repository docs only: Markdown inside plugins (skills, agents, READMEs) is plugin content.
"type:docs":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**
          - .claude/**/*.md

"type:chore":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - scripts/**
          - tests/**
          - templates/**
          - .editorconfig
          - .gitignore
          - pyrightconfig.json
          - shellcheckrc
          - .pre-commit-config.yaml

"security-review":
  - changed-files:
      - any-glob-to-any-file:
          - plugins/*/hooks/**
          - plugins/*/.mcp.json
          - plugins/*/.lsp.json
          - plugins/*/bin/**
          - plugins/*/monitors/**
          - .github/workflows/**

"plugin:hello-example":
  - changed-files:
      - any-glob-to-any-file:
          - plugins/hello-example/**

"category:development":
  - changed-files:
      - any-glob-to-any-file:
          - plugins/hello-example/**
