# Labels as code, synced by .github/workflows/labels.yml (docs/releasing.md#labels).
# plugin:<name> labels are appended by scripts/new_plugin.py.

- name: "type:bug"
  color: "d73a4a"
  description: "Something does not work as documented"
- name: "type:feature"
  color: "a2eeef"
  description: "New capability or enhancement"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type:chore"
  color: "ededed"
  description: "Tooling, CI or repository maintenance"
- name: "type:security"
  color: "b60205"
  description: "Security fix or hardening"
- name: "type:breaking"
  color: "b60205"
  description: "Breaking change for users of a plugin"
- name: "semver:major"
  color: "b60205"
  description: "Breaking change: next release bumps MAJOR"
- name: "semver:minor"
  color: "fbca04"
  description: "New backward-compatible feature: bumps MINOR"
- name: "semver:patch"
  color: "0e8a16"
  description: "Fix or documentation: bumps PATCH"
- name: "status:needs-triage"
  color: "fef2c0"
  description: "Waiting for a maintainer to review"
- name: "status:needs-info"
  color: "fef2c0"
  description: "Waiting for more information from the author"
- name: "status:blocked"
  color: "e99695"
  description: "Cannot proceed until something else is resolved"
- name: "status:ready"
  color: "c2e0c6"
  description: "Accepted and ready to work on"
- name: "status:in-review"
  color: "bfd4f2"
  description: "A pull request is under review"
- name: "priority:high"
  color: "b60205"
  description: "Address first"
- name: "priority:medium"
  color: "fbca04"
  description: "Address soon"
- name: "priority:low"
  color: "c2e0c6"
  description: "Address when possible"
- name: "security-review"
  color: "5319e7"
  description: "Touches hooks, MCP or LSP servers, executables or mods"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "category:workflows"
  color: "1d76db"
  description: "Multi-step processes Claude carries out end to end"
- name: "category:agents"
  color: "1d76db"
  description: "Specialized subagents Claude delegates focused work to"
- name: "category:audits"
  color: "1d76db"
  description: "Systematic checks of code, configuration or content"
- name: "category:code-review"
  color: "1d76db"
  description: "Reviewing changes and pull requests"
- name: "category:documentation"
  color: "1d76db"
  description: "Writing and maintaining documentation"
- name: "category:development"
  color: "1d76db"
  description: "Day-to-day software development"
- name: "category:best-practices"
  color: "1d76db"
  description: "Conventions, standards and quality guidance"
- name: "category:research"
  color: "1d76db"
  description: "Deep web and source research"
- name: "category:model-behavior"
  color: "1d76db"
  description: "Output styles, guardrails and operating rules"
- name: "plugin:hello-example"
  color: "c5def5"
  description: "Hello Example plugin"
